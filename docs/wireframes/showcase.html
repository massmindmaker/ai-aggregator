.light {
  --bg:#fff; --bg-elev:#fafafa; --bg-surface:#f4f4f5;
  --ink:#18181b; --ink-muted:#6b6b73; --ink-faint:#8b8b94;
  --accent:#f59e0b; --accent-hover:#d97706; --accent-ink:#000;
  --amber-soft:rgba(245,158,11,.14);
  --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.16);
  --success:#16a34a; --danger:#dc2626; --warning:#ca8a04;
  --shadow-card:0 1px 2px rgba(0,0,0,.06);
  --shadow-pop:0 20px 60px rgba(0,0,0,.22);
}

* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.5; min-height:100vh;
  /* outer page (the chrome around the showcase) keeps its own theme via .dark on <html>;
     stage re-themes independently */
  transition:background .4s var(--ease), color .4s var(--ease);
}
.mono { font-family:'JetBrains Mono',ui-monospace,monospace; font-feature-settings:'tnum'; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
::-webkit-scrollbar { width:.4em; height:.4em; }
::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:4px; }

/* ════════ ANIMATIONS (ported from globals.css) ════════ */
@keyframes aiag-fade-up { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.aiag-fade-up { animation:aiag-fade-up 600ms var(--ease) both; }

.aiag-stagger > * { opacity:0; animation:aiag-fade-up 560ms var(--ease) forwards; }
.aiag-stagger > *:nth-child(1){animation-delay:40ms}
.aiag-stagger > *:nth-child(2){animation-delay:100ms}
.aiag-stagger > *:nth-child(3){animation-delay:160ms}
.aiag-stagger > *:nth-child(4){animation-delay:220ms}
.aiag-stagger > *:nth-child(5){animation-delay:280ms}
.aiag-stagger > *:nth-child(6){animation-delay:340ms}
.aiag-stagger > *:nth-child(7){animation-delay:400ms}
.aiag-stagger > *:nth-child(8){animation-delay:460ms}
.aiag-stagger > *:nth-child(n+9){animation-delay:520ms}

/* glow-hover: card lift + amber glow ring */
.aiag-glow-hover { transition:box-shadow 240ms var(--ease), transform 240ms var(--ease), border-color 240ms var(--ease); }
.aiag-glow-hover:hover { transform:translateY(-3px); box-shadow:0 0 0 1px rgba(245,158,11,.4), 0 10px 34px rgba(245,158,11,.10); }

/* pulse-dot (live / streaming) */
@keyframes aiag-pulse-dot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.7);opacity:0} }
.aiag-pulse-dot { position:relative; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
.aiag-pulse-dot::after { content:''; position:absolute; inset:0; border-radius:inherit; background:inherit; animation:aiag-pulse-dot 1.8s ease-out infinite; }
.aiag-pulse-dot.dot-success { background:var(--success); }
.aiag-pulse-dot.dot-danger { background:var(--danger); }

/* skeleton shimmer */
@keyframes aiag-shimmer { from{background-position:-200% 0} to{background-position:200% 0} }
.aiag-skeleton { background:linear-gradient(90deg,var(--bg-elev) 0%,rgba(245,158,11,.07) 50%,var(--bg-elev) 100%); background-size:200% 100%; animation:aiag-shimmer 1.6s linear infinite; border-radius:var(--radius-sm); }

/* aurora drifting amber blobs */
@keyframes aiag-aurora-drift { 0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.4} 33%{transform:translate3d(40px,-30px,0) scale(1.15);opacity:.55} 66%{transform:translate3d(-30px,20px,0) scale(.95);opacity:.32} }
.aiag-aurora { position:absolute; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle at center,rgba(245,158,11,.16) 0%,rgba(245,158,11,.05) 40%,transparent 70%); filter:blur(60px); pointer-events:none; animation:aiag-aurora-drift 18s ease-in-out infinite; will-change:transform,opacity; }

/* featured conic-gradient spin ring */
@keyframes aiag-conic-spin { to{transform:rotate(360deg)} }
.aiag-featured-ring { position:relative; isolation:isolate; }
.aiag-featured-ring::before { content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px; background:conic-gradient(from 0deg, rgba(245,158,11,0) 0deg, rgba(245,158,11,.85) 60deg, rgba(245,158,11,0) 120deg, rgba(245,158,11,0) 360deg); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:aiag-conic-spin 7s linear infinite; z-index:-1; }

/* logo chain-glow */
@keyframes aiag-logo-dot-glow { 0%,70%,100%{filter:brightness(1)} 15%,35%{filter:brightness(1.35) drop-shadow(0 0 5px rgba(245,158,11,.95)) drop-shadow(0 0 14px rgba(245,158,11,.5))} }
.aiag-logo-dot { animation:aiag-logo-dot-glow 3.2s ease-in-out infinite; }

/* checkmark draw-in */
@keyframes aiag-check-draw { to{stroke-dashoffset:0} }
.aiag-check-svg path { stroke:var(--success); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:50; stroke-dashoffset:50; animation:aiag-check-draw 600ms ease-out .1s forwards; }

/* drawer / modal */
@keyframes aiag-overlay-fade-in { from{opacity:0} to{opacity:1} }
@keyframes aiag-modal-pop { from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes aiag-sheet-up { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes aiag-drawer-slide { from{transform:translateX(-100%)} to{transform:translateX(0)} }

/* view-transition style cross-fade for screen swaps */
@keyframes aiag-screen-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.screen-anim { animation:aiag-screen-in 320ms var(--ease) both; }

/* ════════ OUTER CHROME (control bar + overview strip) ════════ */
.chrome { max-width:1500px; margin:0 auto; padding:22px 22px 64px; }

.controlbar {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 16px; margin-bottom:20px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:var(--radius);
}
.brand { display:flex; align-items:center; gap:10px; }
.brand .mark {
  width:30px; height:30px; flex:none;
  background:var(--accent);
  -webkit-mask:var(--logo-mask) center/contain no-repeat;
          mask:var(--logo-mask) center/contain no-repeat;
}
.brand .word { font-weight:800; letter-spacing:-.03em; font-size:17px; }
.brand .word b { color:var(--accent); font-weight:800; }
.brand .tag { font-size:10px; color:var(--ink-muted); letter-spacing:.14em; text-transform:uppercase; margin-top:1px; }

.ctrl-spacer { flex:1; }
.seg {
  display:inline-flex; padding:3px; gap:2px;
  background:var(--bg-surface); border:1px solid var(--line);
  border-radius:var(--radius-md);
}
.seg button {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 13px; font-size:13px; font-weight:600;
  color:var(--ink-muted); border-radius:var(--radius-sm);
  transition:color .18s var(--ease), background .18s var(--ease);
}
.seg button:hover { color:var(--ink); }
.seg button.on { background:var(--accent); color:var(--accent-ink); }
.seg .ico { font-size:14px; }
.seg-label { font-size:10px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.1em; margin-right:-4px; align-self:center; }

/* overview strip — all 4 combos as live mini thumbnails */
.overview { margin-bottom:26px; }
.ov-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.ov-head h2 { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-muted); }
.ov-head span { font-size:12px; color:var(--ink-muted); }
.ov-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:900px){ .ov-grid{ grid-template-columns:repeat(2,1fr); } }
.ov-card {
  border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; background:var(--bg-elev); cursor:pointer;
  transition:transform .24s var(--ease), box-shadow .24s var(--ease), border-color .24s var(--ease);
}
.ov-card:hover { transform:translateY(-3px); box-shadow:0 0 0 1px rgba(245,158,11,.4), 0 10px 30px rgba(245,158,11,.10); }
.ov-card.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.ov-cap { display:flex; align-items:center; justify-content:space-between; padding:8px 11px; font-size:11px; font-weight:600; border-top:1px solid var(--line); }
.ov-cap .badge { font-size:9px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.08em; }
/* the thumbnail itself is a fully-styled micro-render, scoped by class */
.thumb { height:150px; position:relative; overflow:hidden; }
.thumb-inner { position:absolute; inset:0; transform:scale(.5); transform-origin:top left; width:200%; height:200%; }

/* ════════ THE STAGE (live toggled big view) ════════ */
.stage-wrap { position:relative; }
.stage-bg { position:absolute; inset:-40px; z-index:0; overflow:hidden; pointer-events:none; }
.stage {
  position:relative; z-index:1;
  display:flex; justify-content:center; padding:18px 0 8px;
}

/* ---- desktop "app window" frame ---- */
.win {
  width:100%; max-width:1180px;
  border:1px solid var(--line-strong); border-radius:12px;
  overflow:hidden; background:var(--bg);
  box-shadow:var(--shadow-pop);
  transition:background .4s var(--ease), border-color .4s var(--ease);
}
.win-bar { display:flex; align-items:center; gap:8px; padding:11px 14px; background:var(--bg-elev); border-bottom:1px solid var(--line); }
.win-dots { display:flex; gap:6px; }
.win-dots i { width:11px; height:11px; border-radius:50%; display:block; }
.win-dots i:nth-child(1){background:#ff5f57} .win-dots i:nth-child(2){background:#febc2e} .win-dots i:nth-child(3){background:#28c840}
.win-url { flex:1; text-align:center; font-size:11px; color:var(--ink-muted); }
.win-url .lock { opacity:.7; }

/* ---- phone frame ---- */
.phone {
  width:392px; max-width:96vw;
  border:10px solid #050507; border-radius:42px;
  background:var(--bg); overflow:hidden;
  box-shadow:var(--shadow-pop), 0 0 0 2px var(--line-strong);
  position:relative;
}
.light .phone { border-color:#1a1a1d; }
.phone-notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:128px; height:24px; background:#050507; border-radius:0 0 16px 16px; z-index:30; }
.light .phone-notch { background:#1a1a1d; }
.phone-status { display:flex; align-items:center; justify-content:space-between; padding:9px 22px 4px; font-size:12px; font-weight:600; }
.phone-status .sigs { display:flex; gap:5px; align-items:center; }

/* The actual application shell */
.app { display:flex; background:var(--bg); transition:background .4s var(--ease); }
/* desktop: sidebar layout */
.win .app { min-height:660px; }
.win .sidebar { display:flex; }
.win .tabbar { display:none; }
/* mobile: bottom tabbar, no sidebar */
.phone .app { flex-direction:column; min-height:660px; }
.phone .sidebar { display:none; }
.phone .tabbar { display:flex; }

.sidebar {
  width:212px; flex:none; flex-direction:column; gap:4px;
  padding:16px 12px; border-right:1px solid var(--line); background:var(--bg-elev);
}
.side-brand { display:flex; align-items:center; gap:9px; padding:6px 8px 14px; }
.side-brand .mark { width:24px; height:24px; background:var(--accent); -webkit-mask:var(--logo-mask) center/contain no-repeat; mask:var(--logo-mask) center/contain no-repeat; }
.side-brand .word { font-weight:800; font-size:15px; letter-spacing:-.03em; }
.side-brand .word b { color:var(--accent); }
.nav-item {
  display:flex; align-items:center; gap:11px; width:100%;
  padding:9px 11px; border-radius:var(--radius-md);
  font-size:14px; font-weight:500; color:var(--ink-muted);
  position:relative; transition:background .16s var(--ease), color .16s var(--ease);
}
.nav-item .ni-ico { width:18px; text-align:center; font-size:15px; }
.nav-item:hover { background:var(--bg-surface); color:var(--ink); }
.nav-item.on { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--ink); }
.nav-item.on::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--accent); }
.nav-item .badge { margin-left:auto; font-size:10px; padding:1px 6px; border-radius:9px; background:var(--bg-surface); color:var(--ink-muted); }
.side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
.side-wallet { display:flex; align-items:center; gap:9px; padding:8px; border-radius:var(--radius-md); background:var(--bg-surface); }
.side-wallet .wico { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); font-size:14px; }
.side-wallet .wbal { font-size:14px; font-weight:700; }
.side-wallet .wsub { font-size:10px; color:var(--ink-muted); }

.tabbar {
  position:absolute; bottom:0; left:0; right:0;
  align-items:center; justify-content:space-around;
  padding:8px 6px 12px; background:var(--bg-elev); border-top:1px solid var(--line); z-index:20;
}
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-muted); padding:3px 12px; border-radius:8px; transition:color .16s var(--ease); }
.tab .t-ico { font-size:19px; }
.tab.on { color:var(--accent); }

/* main content area */
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); }
.phone .topbar { padding:8px 16px 12px; }
.topbar h1 { font-size:19px; font-weight:700; letter-spacing:-.02em; }
.phone .topbar h1 { font-size:18px; }
.topbar .sub { font-size:12px; color:var(--ink-muted); margin-top:1px; }
.search {
  flex:1; max-width:340px; display:flex; align-items:center; gap:8px;
  padding:7px 11px; background:var(--bg-surface); border:1px solid var(--line); border-radius:var(--radius-md);
  font-size:13px; color:var(--ink-muted);
}
.phone .search { display:none; }
.scroll { flex:1; overflow-y:auto; padding:20px 22px; padding-bottom:24px; position:relative; }
.phone .scroll { padding:16px 16px 86px; }

/* ════════ REUSABLE UI ════════ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 16px; border-radius:var(--radius-md);
  font-size:13px; font-weight:600;
  transition:background .16s var(--ease), transform .1s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
}
.btn:active { transform:translateY(1px) scale(.99); }
.btn-primary { background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover { background:var(--accent-hover); box-shadow:0 6px 18px rgba(245,158,11,.28); }
.btn-ghost { background:var(--bg-surface); color:var(--ink); border:1px solid var(--line); }
.btn-ghost:hover { border-color:var(--line-strong); }
.btn-block { width:100%; }
.btn-lg { padding:12px 20px; font-size:14px; }
.btn-sm { padding:6px 11px; font-size:12px; }

.chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:9999px; font-size:12px; font-weight:500;
  background:var(--bg-surface); border:1px solid var(--line); color:var(--ink);
  transition:border-color .16s var(--ease), background .16s var(--ease);
}
.chip:hover { border-color:var(--accent); }
.chip.on { background:color-mix(in srgb,var(--accent) 16%,transparent); border-color:var(--accent); color:var(--ink); }
.chip-static { cursor:default; }

.card {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px;
  /* hairline elevation — no generic card drop-shadow (DESIGN.md) */
}

.pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:9999px; }
.pill-accent { color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); }
.pill-success { color:var(--success); background:color-mix(in srgb,var(--success) 14%,transparent); }
.pill-muted { color:var(--ink-muted); background:var(--bg-surface); }
.pill-free { color:var(--success); background:color-mix(in srgb,var(--success) 14%,transparent); }

.kbar { font-size:11px; color:var(--ink-muted); }
.kbar b { color:var(--ink); }
.divider { height:1px; background:var(--line); margin:16px 0; }
.muted { color:var(--ink-muted); }
.tnum { font-feature-settings:'tnum'; }

/* ════════ SCREEN: HOME (agent catalog) ════════ */
.sec-h { display:flex; align-items:center; gap:10px; margin:4px 0 14px; }
.sec-h h3 { font-size:14px; font-weight:700; }
.sec-h .more { margin-left:auto; font-size:12px; color:var(--accent); }

.cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:14px; }
.phone .cat-grid { grid-template-columns:1fr; }

.agent-card {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px; cursor:pointer; display:flex; flex-direction:column; gap:11px;
}
.agent-top { display:flex; align-items:center; gap:11px; }
.portrait {
  width:46px; height:46px; flex:none; border-radius:11px; display:grid; place-items:center;
  font-weight:800; font-size:18px; letter-spacing:-.02em;
  color:#fff; position:relative; overflow:hidden;
}
.portrait::after { content:''; position:absolute; inset:0; background:linear-gradient(140deg,rgba(255,255,255,.22),transparent 55%); }
.agent-name { font-size:15px; font-weight:700; letter-spacing:-.01em; }
.agent-role { font-size:12px; color:var(--ink-muted); margin-top:1px; }
.agent-meta { display:flex; align-items:center; gap:12px; font-size:11px; color:var(--ink-muted); }
.agent-meta .mono { color:var(--ink); }
.agent-foot { display:flex; align-items:center; gap:8px; margin-top:2px; }
.star { color:var(--accent); }
.modeltag { font-size:11px; color:var(--ink-muted); display:inline-flex; align-items:center; gap:5px; }
.modeltag .dotm { width:6px; height:6px; border-radius:50%; background:var(--accent); }

/* ════════ SCREEN: AGENT DETAIL ════════ */
.detail-head { display:flex; gap:16px; align-items:flex-start; }
.detail-head .portrait { width:70px; height:70px; border-radius:16px; font-size:26px; }
.phone .detail-head .portrait { width:58px; height:58px; }
.detail-title h2 { font-size:22px; font-weight:800; letter-spacing:-.02em; }
.phone .detail-title h2 { font-size:19px; }
.detail-title .role { color:var(--ink-muted); font-size:13px; margin-top:2px; }
.detail-stats { display:flex; gap:18px; margin-top:10px; flex-wrap:wrap; }
.dstat .v { font-size:15px; font-weight:700; }
.dstat .k { font-size:11px; color:var(--ink-muted); }
.rent-line {
  display:flex; align-items:center; gap:10px; padding:11px 14px; margin-top:14px;
  background:var(--bg-surface); border:1px solid var(--line); border-radius:var(--radius-md);
  font-size:13px;
}
.rent-line .who { display:flex; align-items:center; gap:7px; }
.rent-avatar { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#6366f1); }
.cost-break { margin-top:14px; }
.cost-row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--line); }
.cost-row:last-child { border-bottom:none; }
.cost-row.total { font-weight:700; border-bottom:none; padding-top:11px; }
.cost-row .lbl { color:var(--ink-muted); display:flex; align-items:center; gap:7px; }
.cost-row.total .lbl { color:var(--ink); }

/* ════════ SCREEN: CHAT ════════ */
.chat-wrap { display:flex; flex-direction:column; height:100%; }
.chat-head { display:flex; align-items:center; gap:11px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.chat-body { flex:1; display:flex; flex-direction:column; gap:14px; overflow-y:auto; padding-right:4px; }
.msg { max-width:80%; }
.msg.user { align-self:flex-end; }
.msg .bubble { padding:11px 14px; border-radius:14px; font-size:14px; line-height:1.55; }
.msg.user .bubble { background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px; }
.msg.bot .bubble { background:var(--bg-elev); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.bot .who { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:11px; color:var(--ink-muted); font-weight:600; }
.msg .meta { font-size:10px; color:var(--ink-muted); margin-top:5px; }
.typing { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-muted); }
/* honest async "working" state — NOT a streaming typer */
.working { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:14px; border:1px solid var(--line); border-bottom-left-radius:5px; background:var(--bg-elev); }
.working .wk-txt { font-size:13px; color:var(--ink-muted); line-height:1.5; }
.working .wk-txt b { color:var(--ink); font-weight:600; }
.composer { margin-top:14px; }
.composer-row { display:flex; align-items:flex-end; gap:10px; padding:9px 11px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); }
.composer-row:focus-within { border-color:var(--accent); }
.composer-input { flex:1; font-size:14px; color:var(--ink); background:transparent; border:none; outline:none; resize:none; min-height:22px; max-height:90px; font-family:inherit; }
.composer-input::placeholder { color:var(--ink-muted); }
.send-btn { width:36px; height:36px; flex:none; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:16px; }
.composer-foot { display:flex; align-items:center; gap:12px; margin-top:9px; font-size:11px; color:var(--ink-muted); }

/* ════════ SCREEN: CREATE / CONFIGURE ════════ */
.path-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.phone .path-grid { grid-template-columns:1fr; }
.path-card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:18px; cursor:pointer; }
.path-card .pico { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; font-size:20px; background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); margin-bottom:12px; }
.path-card h4 { font-size:15px; font-weight:700; margin-bottom:5px; }
.path-card p { font-size:12.5px; color:var(--ink-muted); line-height:1.5; }
.field { margin-bottom:18px; }
.field > label { display:block; font-size:12px; font-weight:600; margin-bottom:7px; }
.field .hint { font-size:11px; color:var(--ink-muted); font-weight:400; }
.input, .textarea, .select {
  width:100%; padding:10px 12px; font-size:13px; color:var(--ink);
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-md);
  font-family:inherit; outline:none; transition:border-color .16s var(--ease);
}
.input:focus, .textarea:focus, .select:focus { border-color:var(--accent); }
.textarea { resize:vertical; min-height:74px; line-height:1.5; }
.chiprow { display:flex; flex-wrap:wrap; gap:8px; }
.range-wrap { display:flex; align-items:center; gap:14px; }
.range-wrap input[type=range] { flex:1; accent-color:var(--accent); }
.range-val { font-size:14px; font-weight:700; min-width:62px; text-align:right; }
.tool-row { display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-md); margin-bottom:8px; background:var(--bg-elev); }
.tool-row .ti { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--bg-surface); font-size:15px; }
.tool-row .tt { flex:1; }
.tool-row .tt b { font-size:13px; }
.tool-row .tt span { font-size:11px; color:var(--ink-muted); }
.switch { width:38px; height:22px; border-radius:11px; background:var(--bg-surface); border:1px solid var(--line); position:relative; transition:background .2s var(--ease); flex:none; }
.switch::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink-muted); transition:transform .2s var(--ease), background .2s var(--ease); }
.switch.on { background:var(--accent); }
.switch.on::after { transform:translateX(16px); background:var(--accent-ink); }

/* ════════ SCREEN: PROVIDER PICKER ════════ */
.prov-list { display:flex; flex-direction:column; gap:10px; }
.prov-card { display:flex; align-items:center; gap:14px; padding:15px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; }
.prov-card.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.prov-logo { width:42px; height:42px; flex:none; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:16px; }
.prov-info { flex:1; min-width:0; }
.prov-info b { font-size:14px; }
.prov-info p { font-size:12px; color:var(--ink-muted); margin-top:2px; }
.prov-fee { text-align:right; flex:none; }
.prov-fee .f { font-size:13px; font-weight:700; }
.prov-fee .fk { font-size:10px; color:var(--ink-muted); }
.radio { width:20px; height:20px; flex:none; border-radius:50%; border:2px solid var(--line-strong); position:relative; }
.prov-card.on .radio { border-color:var(--accent); }
.prov-card.on .radio::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }

/* ════════ SCREEN: WALLET ════════ */
.wallet-hero { padding:22px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); position:relative; overflow:hidden; }
.wallet-hero .lbl { font-size:12px; color:var(--ink-muted); }
.wallet-hero .bal { font-size:40px; font-weight:800; letter-spacing:-.03em; margin-top:4px; }
.phone .wallet-hero .bal { font-size:34px; }
.wallet-hero .bal small { font-size:18px; color:var(--ink-muted); font-weight:600; }
.wallet-hero .usd { font-size:13px; color:var(--ink-muted); margin-top:2px; }
.crypto-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:18px; }
.crypto-card { display:flex; align-items:center; gap:11px; padding:12px; background:var(--bg-surface); border:1px solid var(--line); border-radius:var(--radius-md); }
.crypto-card .ci { width:34px; height:34px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; color:#fff; }
.crypto-card .cn { font-size:12px; color:var(--ink-muted); }
.crypto-card .cv { font-size:14px; font-weight:700; }
.tx-row { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); }
.tx-row:last-child { border-bottom:none; }
.tx-ico { width:34px; height:34px; flex:none; border-radius:9px; display:grid; place-items:center; background:var(--bg-surface); font-size:15px; }
.tx-row .tx-main { flex:1; }
.tx-row .tx-main b { font-size:13px; }
.tx-row .tx-main span { font-size:11px; color:var(--ink-muted); }
.tx-amt { font-size:13px; font-weight:700; font-family:'JetBrains Mono',monospace; }

function openModal(key){
  const m = MODALS[key]; if(!m) return;
  const ov = document.getElementById('overlay'); if(!ov) return;
  let recap = m.recap ? `<div class="modal-recap">${m.recap.map(r=>`<div class="r"><span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` : '';
  let topup = m.topup ? `<div class="chiprow" style="margin-bottom:14px">
      <span class="chip on">TON ${rd('live')}</span><span class="chip chip-static disabled-soon">USDT ${rd('soon')}</span><span class="chip chip-static disabled-soon">USDC/HOT ${rd('soon')}</span>
    </div>
    <div class="price-input" style="margin-bottom:18px"><input value="50" inputmode="decimal" /><span class="cur">кр ≈ $50</span></div>` : '';
  const actions = m.actions.map(a=>{ const [lbl,go,kind]=a.split('|'); return `<button class="btn btn-${kind==='primary'?'primary':'ghost'} btn-block" data-maction="${go}">${lbl}</button>`; }).join('');
  ov.querySelector('.modal').innerHTML = `
    <div class="m-ico ${m.cls}">${m.ico}</div>
    <h3>${m.t}</h3>
    <p>${m.p}</p>
    ${recap}${topup}
    <div class="m-actions">${actions}</div>`;
  ov.classList.add('show');
}
function closeModal(){ const ov=document.getElementById('overlay'); if(ov) ov.classList.remove('show'); }

    <div class="win">
      <div class="win-bar">
        <div class="win-dots"><i></i><i></i><i></i></div>
        <div class="win-url"><span class="lock">🔒</span> t.me/aiaggbot · мини-приложение</div>
        <div style="width:54px"></div>
      </div>
      ${appHTML()}
    </div>`;
}

/* ════════ MOUNT + EVENTS ════════ */
const stage = document.getElementById('stage');
function mount(){
  stage.innerHTML = frameHTML();
  // re-apply theme class to stage frame (independent of outer chrome)
  const frame = stage.firstElementChild.nextElementSibling || stage.firstElementChild;
}
function setTheme(t){
  state.theme=t;
  // stage frame gets the themed class; outer page also flips so the founder
  // sees the chrome match — mimics next-themes class swap on a root.
  document.documentElement.classList.toggle('light', t==='light');
  document.documentElement.classList.toggle('dark', t!=='light');
  syncSeg('themeSeg','theme',t);
  buildOverview();
}
function setDevice(d){ state.device=d; syncSeg('deviceSeg','device',d); mount(); buildOverview(); }
function go(screen){
  if(!RENDER[screen]) return;
  if(state.screen!=='home') skelOn=false;
  state.screen=screen;
  // view-transition cross-fade when supported
  if(document.startViewTransition){ document.startViewTransition(()=>mount()); }
  else { mount(); }
}
function syncSeg(segId, attr, val){
  document.querySelectorAll(`#${segId} button`).forEach(b=>b.classList.toggle('on', b.dataset[attr]===val));
}

/* delegated clicks across the whole document */
document.addEventListener('click', e=>{
  const seg = e.target.closest('#themeSeg button'); if(seg){ setTheme(seg.dataset.theme); return; }
  const dev = e.target.closest('#deviceSeg button'); if(dev){ setDevice(dev.dataset.device); return; }

  const ovc = e.target.closest('.ov-card'); if(ovc){ setTheme(ovc.dataset.theme); setDevice(ovc.dataset.device); document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'}); return; }

  const go_ = e.target.closest('[data-go]'); if(go_){ go(go_.dataset.go); return; }
  const mod = e.target.closest('[data-modal]'); if(mod){ openModal(mod.dataset.modal); return; }
  const mact = e.target.closest('[data-maction]'); if(mact){ const t=mact.dataset.maction; closeModal(); if(t!=='close') go(t); return; }
  const prov = e.target.closest('[data-provider]'); if(prov){ state.provider=prov.dataset.provider; mount(); return; }
  const pub = e.target.closest('[data-pub]'); if(pub){ state.publishMode=pub.dataset.pub; mount(); return; }
  const mkt = e.target.closest('[data-market]'); if(mkt){ state.marketTab=mkt.dataset.market; mount(); return; }
  const tc = e.target.closest('[data-tcall] .tcall-head'); if(tc){ tc.closest('.tcall').classList.toggle('open'); return; }
  const tg = e.target.closest('[data-toggle]'); if(tg){ tg.classList.toggle('on'); return; }
  if(e.target.closest('#skelToggle')){ skelOn=!skelOn; mount(); return; }

  // close modal on overlay backdrop click
  const ov = e.target.closest('.overlay'); if(ov && e.target===ov){ closeModal(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='budgetRange'){ state.budget=+e.target.value; const v=document.getElementById('budgetVal'); if(v) v.textContent=state.budget+',0 кр'; }
});

/* ════════ OVERVIEW STRIP — 4 live micro-renders ════════ */
function buildOverview(){
  const combos = [
    {device:'web', theme:'dark', label:'Веб · Тёмная'},
    {device:'web', theme:'light', label:'Веб · Светлая'},
    {device:'mobile', theme:'dark', label:'Моб · Тёмная'},
    {device:'mobile', theme:'light', label:'Моб · Светлая'},
  ];
  const grid = document.getElementById('ovGrid');
  grid.innerHTML = combos.map(c=>{
    const active = (c.device===state.device && c.theme===state.theme);
    return `<div class="ov-card ${active?'active':''}" data-theme="${c.theme}" data-device="${c.device}">
      <div class="thumb ${c.theme}" data-thumb="${c.device}-${c.theme}"></div>
      <div class="ov-cap"><span>${c.label}</span><span class="badge">${active?'● активно':'открыть'}</span></div>
    </div>`;
  }).join('');
  // fill each thumbnail with a scaled, themed mini home screen
  grid.querySelectorAll('.thumb').forEach(t=>{
    const [device,theme] = t.dataset.thumb.split('-');
    t.innerHTML = `<div class="thumb-inner ${theme}" style="background:var(--bg)">${thumbContent(device)}</div>`;
  });
}
function thumbContent(device){
  // a static, miniature snapshot of the catalog screen — themed by parent class
  const mini = AGENTS.slice(0,4).map(a=>`
    <div style="background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:9px;align-items:center">
      <div style="width:34px;height:34px;border-radius:9px;background:${HUES[a.hue]};display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px">${a.mono}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:13px;color:var(--ink)">${a.name}</div><div style="font-size:11px;color:var(--ink-muted)">${a.role}</div></div>
      <div style="font-size:11px;color:var(--accent);font-weight:700">★ ${a.star}</div>
    </div>`).join('');
  if(device==='mobile'){
    return `<div style="padding:16px 14px;display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="width:18px;height:18px;background:var(--accent);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat"></span>
        <b style="font-size:16px;color:var(--ink)">Агенты</b>
      </div>${mini}
      <div style="position:absolute;bottom:0;left:0;right:0;height:46px;background:var(--bg-elev);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;font-size:11px;color:var(--ink-muted)"><span style="color:var(--accent)">⬡ Агенты</span><span>＋</span><span>🧩</span><span>◈</span><span>☉</span></div>
    </div>`;
  }
  return `<div style="display:flex;height:100%">
    <div style="width:150px;background:var(--bg-elev);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="width:18px;height:18px;background:var(--accent);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat"></span><b style="font-size:14px;color:var(--ink)">AI·Agg</b></div>
      <div style="background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);padding:8px 10px;border-radius:7px;font-size:13px;font-weight:600">⬡ Агенты</div>
      <div style="color:var(--ink-muted);padding:8px 10px;font-size:13px">＋ Создать</div>
      <div style="color:var(--ink-muted);padding:8px 10px;font-size:13px">🧩 Тулзы</div>
      <div style="color:var(--ink-muted);padding:8px 10px;font-size:13px">◈ Кошелёк</div>
      <div style="color:var(--ink-muted);padding:8px 10px;font-size:13px">☉ Профиль</div>
    </div>
    <div style="flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:9px">
      <b style="font-size:18px;color:var(--ink)">Каталог агентов</b>${mini}
    </div>
  </div>`;
}

/* ════════ INIT ════════ */
setTheme('dark');
setDevice('web');
buildOverview();
mount();
</script>
</body>
</html>
