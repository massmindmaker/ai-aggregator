<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AIAG — Project Dashboard</title>
<style>
  :root{
    --bg:#0a0a0b;--bg-elev:#111114;--bg-surface:#18181b;--ink:#f4f4f5;--ink-muted:#8b8b94;--ink-faint:#71717a;
    --accent:#f59e0b;--accent-hover:#d97706;--accent-ink:#000;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
    --good:#22c55e;--soon:#7aa2f7;--danger:#ef4444;--radius:8px;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --logo-mask:url('wireframes/assets/logo.png');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased}
  .sb{width:250px;flex:none;height:100vh;border-right:1px solid var(--line);background:var(--bg-elev);display:flex;flex-direction:column;padding:16px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;cursor:pointer}
  .mark{width:26px;height:26px;flex:none;background:var(--accent);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
  .brand b{font-size:15px;letter-spacing:-.01em}.brand .sub{font-family:var(--mono);font-size:9px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
  .search{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-surface)}
  .search input{flex:1;background:none;border:0;color:var(--ink);font:13px var(--sans);outline:none}.search input::placeholder{color:var(--ink-faint)}
  .search .x{color:var(--ink-faint);cursor:pointer;font-size:14px;display:none}
  .nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--ink-muted);font:500 13.5px var(--sans);padding:10px 12px;border-radius:var(--radius);cursor:pointer;position:relative;transition:background .15s,color .15s}
  .nav button:hover{background:var(--bg-surface);color:var(--ink)}
  .nav button.on{background:rgba(245,158,11,.12);color:var(--accent)}
  .nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
  .nav .ic{width:18px;text-align:center;font-size:14px}.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .sbfoot{padding:11px 10px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-faint);line-height:1.7}
  .sbfoot a{color:var(--ink-muted)} .srv{color:var(--good)} .srv.off{color:var(--ink-faint)}

  .main{flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .page{flex:1;overflow-y:auto;padding:28px 32px 60px}
  .head{margin-bottom:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  h1{font-size:25px;letter-spacing:-.02em}
  .lead{color:var(--ink-muted);font-size:14px;margin-top:8px;max-width:80ch}
  .chips{display:flex;gap:8px;margin:14px 0 4px}
  .chip{font:500 12px var(--sans);color:var(--ink-muted);background:var(--bg-surface);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer}
  .chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:12px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--bg-surface);padding:15px 16px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
  .card:hover{border-color:rgba(245,158,11,.45);transform:translateY(-2px);box-shadow:0 10px 30px -16px rgba(245,158,11,.4)}
  .card.star{border-color:rgba(245,158,11,.4)}
  .card .t{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}.card.star .t::after{content:"★";color:var(--accent);font-size:12px}
  .card .d{font-size:12.5px;color:var(--ink-muted);margin-top:6px;line-height:1.5}
  .card .meta{display:flex;align-items:center;gap:8px;margin-top:11px}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-faint)}
  .badge.html{color:var(--accent);border-color:rgba(245,158,11,.4)}.badge.md{color:var(--soon);border-color:rgba(122,162,247,.35)}
  .zone-tag{font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-left:auto}.open-ext{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}.card:hover .open-ext{color:var(--accent)}

  .artifact{flex:1;display:flex;flex-direction:column;min-height:0}
  .abar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg-elev);flex:none}
  .abar .bk{background:var(--bg-surface);border:1px solid var(--line);color:var(--ink);font:600 12.5px var(--sans);padding:7px 13px;border-radius:8px;cursor:pointer}
  .abar .bk:hover{border-color:var(--accent);color:var(--accent)}
  .abar .vt{font-size:14px;font-weight:600}.abar .vp{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}.abar .sp{flex:1}
  .abar .mini{background:none;border:1px solid var(--line);color:var(--ink-muted);font:500 12px var(--sans);padding:6px 11px;border-radius:7px;cursor:pointer}.abar .mini:hover{color:var(--ink);border-color:var(--accent)}
  .artifact iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
  /* markdown reader (served mode) */
  .reader{flex:1;overflow-y:auto;padding:34px 40px 80px}
  .reader .doc{max-width:860px;margin:0 auto;line-height:1.65;color:var(--ink-muted);font-size:15px}
  .reader h1,.reader h2,.reader h3,.reader h4{color:var(--ink);letter-spacing:-.01em;margin:24px 0 10px;line-height:1.25}
  .reader h1{font-size:28px}.reader h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px}.reader h3{font-size:17px}.reader h4{font-size:14px;color:var(--ink-muted)}
  .reader p{margin:10px 0}.reader strong{color:var(--ink)}.reader em{color:var(--ink)}
  .reader a{color:var(--accent)}.reader ul,.reader ol{margin:10px 0 10px 22px}.reader li{margin:4px 0}
  .reader code{font-family:var(--mono);font-size:12.5px;background:var(--bg-surface);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:oklch(.86 .1 75)}
  .reader pre{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}.reader pre code{border:0;background:none;padding:0;color:var(--ink-muted)}
  .reader blockquote{border-left:3px solid var(--accent);background:var(--bg-surface);border-radius:0 8px 8px 0;padding:10px 16px;margin:12px 0;color:var(--ink-muted)}
  .reader table{border-collapse:collapse;margin:14px 0;font-size:13.5px;width:100%}.reader th,.reader td{border:1px solid var(--line);padding:7px 11px;text-align:left}.reader th{color:var(--ink);background:var(--bg-surface);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .reader hr{border:0;border-top:1px solid var(--line);margin:22px 0}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 20px}
  .stat{border:1px solid var(--line);border-radius:12px;background:var(--bg-surface);padding:13px 18px;min-width:124px}
  .stat .v{font-family:var(--mono);font-size:23px}.stat .v small{font-size:12px;color:var(--ink-faint)}.stat .k{font-size:11px;color:var(--ink-faint);margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
  .sec{margin:24px 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:10px}.sec::after{content:"";flex:1;height:1px;background:var(--line)}
  ul.facts{list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.facts li{padding-left:22px;position:relative;color:var(--ink-muted);font-size:13.5px}
  ul.facts li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent)}
  ul.facts.done li::before{background:var(--good);border-color:var(--good)}
  ul.facts li:has(.p-live)::before{background:var(--good);border-color:var(--good)}
  ul.facts li:has(.p-soon)::before{background:var(--accent);border-color:var(--accent)}
  ul.facts li:has(.p-rnd)::before{border-color:var(--ink-faint)}
  ul.facts b{color:var(--ink)}
  .pill{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:5px;border:1px solid;margin-left:4px}.p-live{color:var(--good);border-color:rgba(34,197,94,.45)}.p-branch{color:var(--soon);border-color:rgba(122,162,247,.45)}.p-soon{color:var(--accent);border-color:rgba(245,158,11,.45)}.p-rnd{color:var(--ink-faint);border-color:var(--line-strong)}
  /* persisted checklist */
  .todo{display:flex;flex-direction:column;gap:7px}
  .todo label{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink-muted);cursor:pointer;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg-surface)}
  .todo input{margin-top:2px;accent-color:var(--accent);width:15px;height:15px;flex:none}
  .todo label.done span{color:var(--ink-faint);text-decoration:line-through}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .links a{font:500 12.5px var(--sans);color:var(--ink-muted);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;text-decoration:none}
  .links a:hover{color:var(--accent);border-color:var(--accent)}
  .empty{color:var(--ink-faint);font-size:13px;padding:30px 0}
  @media(max-width:780px){.sb{width:58px}.brand b,.brand .sub,.nav .lbl,.nav .ct,.sbfoot,.search input,.search .x{display:none}.search{justify-content:center}.nav button{justify-content:center}}
</style>
</head>

<script>
const SERVED = location.protocol==='http:' || location.protocol==='https:';
const REPO='https://github.com/massmindmaker/aiag-marketplace';
const TABS=[
 {id:'overview',ic:'📊',name:'Обзор',overview:true},
 {id:'tma',ic:'🎴',name:'TMA · агенты',cards:[
   {t:'★ Дизайн-борд (моб+веб, SoT)',d:'ОДИН борт вместо showcase/tma/web — мобильный+веб, тёмная/светлая, 45 экранов',p:'wireframes/design-board.html',ty:'html',star:1},
   {t:'Product definition',d:'3 способа завести агента, спец, биллинг',p:'specs/2026-06-02-tma-product-definition.md',ty:'md'},
   {t:'Монетизация',d:'Аренда автора (free/цена), AIAG 0% с аренды',p:'specs/2026-06-03-monetization.md',ty:'md'},
   {t:'Provider-picker — ПОСТРОЕНО',d:'Свой провайдер+ключ=0 комиссии при создании агента; money-correct, проверено',p:'specs/2026-06-03-provider-picker-implemented.md',ty:'md',star:1},
   {t:'User workflows',d:'14 джорни → функция → готовность + 10 расхождений',p:'specs/2026-06-03-user-workflows.md',ty:'md'},
   {t:'Canon: что строим',d:'Единый источник правды по TMA',p:'specs/2026-06-02-WHAT-WE-ARE-BUILDING.md',ty:'md'},
   {t:'Hermes explainer',d:'Hermes = рантайм, не модель; платежи',p:'specs/2026-06-02-hermes-core-and-payment-explainer.md',ty:'md'},
   {t:'Hermes WebUI landscape',d:'Конкуренты-UI, позиционирование',p:'specs/2026-06-02-hermes-webui-landscape-and-tma-positioning.md',ty:'md'},
 ]},
 {id:'web',ic:'🌐',name:'Web · модели (₽)',cards:[
   {t:'Web-борд (светлый)',d:'Studio23-тема, маркет моделей, ₽ — отдельный продукт',p:'wireframes/web/index.html',ty:'html'},
   {t:'Product coherence map',d:'Где обещания ≠ реальность',p:'specs/2026-06-02-product-coherence-map.md',ty:'md'},
 ]},
 {id:'design',ic:'🎨',name:'Дизайн',cards:[
   {t:'🟢 ★ НОВЫЙ ДИЗАЙН — redesign-A ПОСТРОЕН (2026-06-12)',d:'Через Superpowers (брейншторм→спек→план→субагенты). Новая IA: 5 табов (Агенты=мессенджер-инбокс · Маркет=карточки-персонажи · Дэшборд · Кошелёк · Аккаунт). Вернул сигнатуру CharCard (характер+статы+автор+live+голо). Финмодель: AIAG-оператор-0 сеет официальных, массы используют/арендуют. 8 тасков, typecheck 0, дизайн-борд обновлён (node-харнес 48 экранов). Спек+план: specs ниже',p:'../docs/superpowers/specs/2026-06-12-tma-redesign-A-shell-market-design.md',ty:'md',star:1},
   {t:'★ Дизайн-борд (SoT) — обновлён под redesign-A',d:'5 табов, дом=инбокс, Маркет=персонажи, +Дэшборд/Кошелёк/Аккаунт, баннер. Каноничный визуальный источник правды',p:'wireframes/design-board.html',ty:'html',star:1},
   {t:'🔴 ★ РАЗРЫВ: дизайнборд (SoT) vs построено (2026-06-12)',d:'«Два разных приложения» (основатель прав). КОРЕНЬ: дизайнборд задаёт дом = ЛЕНТА КАРТОЧЕК-ПЕРСОНАЖЕЙ (характер+статы+автор), а я перестроил его в БИРЖЕВОЙ ХАБ по аудиту Bybit/Binance — выкинул сигнатуру PRODUCT.md. Карточка выхолощена до функц-плитки (анти-референс). ~80% экранов есть как роуты, но не попадают в канон. РАЗВИЛКА за основателем: вернуть канон / узаконить хаб / гибрид (рекоменд.)',p:'specs/2026-06-12-designboard-vs-built-gap.md',ty:'md',star:1},
   {t:'🔴 ★ ФОРЕНЗИК-АУДИТ (2026-06-12) — продукт/UX/дизайн/полнота',d:'5 агентов. Подтвердил жалобу основателя с цифрами: ПРОДУКТ 58 · UX 42 (самая больная) · ДИЗАЙН 63 · ПОЛНОТА 55 /108. Топ-косяки: /templates под 4 именами + «Агенты» в 2 места; деньги-каша «купи-что» + «Арендовать» рядом с «появится позже»; цена/бюджет ×100 (центы как кредиты); потёмкинская витрина шаблонов (0 на проде). Память ВРЁТ В МИНУС: author-rent/MCP/реконсилер построены, а доки помечают not-built. Тихо забыто из канона: мультимодель, run-trace, AI-builder, free-run',p:'specs/2026-06-12-forensic-audit.md',ty:'md',star:1},
   {t:'UI-критика 108 + план улучшений (2026-06-12) — Binance/Bybit-ремесло',d:'Свежий проход после redesign-A. Сейчас: продукт 65 / UX 52 (worst) / дизайн 70 / полнота 57 / адаптивность 50 / анимация 55. Binance/Bybit как референс КАЧЕСТВА (плотность данных, mono-цифры, скорость табов, микроанимация) — без биржевого каркаса на Агентах/Маркете. План: быстрые победы + К1 confirm-в-iOS-фикс + адаптивность safe-area + анимация aiag-* + character-card сигнатура + забытое ядро (мультимодель/AI-builder/free-run/run-trace)',p:'specs/2026-06-12-ui-critique-108-improvement-plan.md',ty:'md',star:1},
   {t:'Модель продукта + Hermes-маппинг + IA-редизайн + 108 (2026-06-12)',d:'СИНТЕЗ 3 ресёрчей. Ответы основателю: шаблон/наём/клон (клон=всё твоё, спек без ключей, память с нуля); наём и клон-агента-напрямую в коде НЕТ. Hermes ПОПРАВКИ: есть REST API (/api/model/set), модели=1 главная+11 aux (image/voice=тулсеты не слоты), kanban+run-trace богатые→проксировать. 108: продукт 55/UX 37/дизайн 67/полнота 48 + подробность-функций 7/27 (худшее, всё в 1450-строчной странице). IA: Агенты→Нанять/Мои/Создать, Маркет→5 разделов, Досье агента. 3 решения основателя: наём vs переименовать, cloneable, курс-на-Hermes',p:'specs/2026-06-12-product-model-hermes-IA-synthesis.md',ty:'md',star:1},
   {t:'Wireframe-борд: недостающие экраны (18) — наём/развёртывание/память (2026-06-12)',d:'Ч/б навигируемый борд под модель основателя: создатель РАЗВОРАЧИВАЕТ Hermes-инстанс, другие НАНИМАЮТ отдельный инстанс с общими скиллами + персональной памятью. 18 артбордов: AI-builder, конструктор спека, развёртывание-инстанса, здоровье агента, публикация, НАНЯТЬ, провижн, ДОСЬЕ-НАНЯТОГО, онбординг/free-run, Маркет-разделы Скиллы/MCP/Тузы/Базы, управление памятью, MCP/BYOK-подключения, модалки. Открыть: docs/wireframes/missing-screens/index.html. Спека: specs/2026-06-12-missing-screens-wireframes-design.md',p:'wireframes/missing-screens/index.html',ty:'html',star:1},
   {t:'HI-FI макеты: наём / развёртывание (dark/amber, 2026-06-12)',d:'5 ключевых экранов модели найма в брендовом виде (DESIGN.md, когерентно с design-board): Развёртывание-инстанса, Нанять (изоляция+цена 210кр), Досье-нанятого (Чат/Память/Спек-read-only), Управление-памятью, Здоровье-агента. Hi-fi предпросмотр перед кодом. Открыть: docs/wireframes/hifi-hire-deploy/index.html',p:'wireframes/hifi-hire-deploy/index.html',ty:'html',star:1},

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mdToHtml(md){
  md=md.replace(/\r\n/g,'\n');
  const fences=[]; md=md.replace(/```([\s\S]*?)```/g,(m,c)=>{fences.push('<pre><code>'+esc(c.replace(/^\n/,''))+'</code></pre>');return 'F'+(fences.length-1)+'';});
  const lines=md.split('\n'); let out=[],i=0;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  while(i<lines.length){
    let l=lines[i];
    if(/^F\d+$/.test(l.trim())){out.push(fences[+l.trim().match(/\d+/)[0]]);i++;continue;}
    if(/^\s*$/.test(l)){i++;continue;}
    let h=l.match(/^(#{1,4})\s+(.*)/); if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(l)){let b=[];while(i<lines.length&&/^>\s?/.test(lines[i])){b.push(inline(lines[i].replace(/^>\s?/,'')));i++;}out.push('<blockquote>'+b.join('<br>')+'</blockquote>');continue;}
    if(/^\s*\|.*\|\s*$/.test(l)){let rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let html='<table>';rows.forEach((r,ri)=>{if(/^\s*\|?[\s:\-|]+\|?\s*$/.test(r))return;const tag=ri===0?'th':'td';html+='<tr>'+cells(r).map(c=>'<'+tag+'>'+inline(c)+'</'+tag+'>').join('')+'</tr>';});out.push(html+'</table>');continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l);let items=[];while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){items.push('<li>'+inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''))+'</li>');i++;}out.push((ol?'<ol>':'<ul>')+items.join('')+(ol?'</ol>':'</ul>'));continue;}
    let para=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,4}\s|>\s?|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])&&!/^F/.test(lines[i].trim())){para.push(inline(lines[i]));i++;}
    if(para.length)out.push('<p>'+para.join(' ')+'</p>');
  }
  return out.join('\n');
}
