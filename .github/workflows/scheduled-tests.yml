name: Scheduled Testing and Monitoring

on:
  schedule:
    # Run daily health checks at 6 AM UTC
    - cron: '0 6 * * *'
    # Run weekly comprehensive tests on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
    # Run monthly performance baseline tests on 1st of each month at 3 AM UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of scheduled test to run'
        required: true
        default: 'health'
        type: choice
        options:
          - health
          - comprehensive
          - performance
          - security
          - migration-readiness

env:
  NODE_VERSION: '18'
  PRODUCTION_URL: 'https://aiag.dev'
  STAGING_URL: 'https://staging.aiag.dev'

jobs:
  # Daily health checks
  daily-health-checks:
    name: Daily Health Checks
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || inputs.test_type == 'health'
    
    strategy:
      matrix:
        environment: [production, staging]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd testing
          npm ci

      - name: Set environment URL
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            echo "TARGET_URL=${{ env.PRODUCTION_URL }}" >> $GITHUB_ENV
          else
            echo "TARGET_URL=${{ env.STAGING_URL }}" >> $GITHUB_ENV
          fi

      - name: Run health checks
        run: |
          cd testing
          npm run test:health
        env:
          TEST_TARGET_URL: ${{ env.TARGET_URL }}

      - name: Check API endpoints
        run: |
          cd testing
          npm run test:api:health
        env:
          TEST_TARGET_URL: ${{ env.TARGET_URL }}

      - name: Monitor response times
        run: |
          cd testing
          npm run test:performance:basic
        env:
          TEST_TARGET_URL: ${{ env.TARGET_URL }}

      - name: Generate health report
        run: |
          cd testing
          npm run test:health:report
          echo "HEALTH_STATUS=$(cat reports/health-status.txt)" >> $GITHUB_ENV
        if: always()

      - name: Send health status notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            📊 Daily Health Check - ${{ matrix.environment }}
            Status: ${{ env.HEALTH_STATUS }}
            URL: ${{ env.TARGET_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure() || env.HEALTH_STATUS == 'unhealthy'

  # Weekly comprehensive tests
  weekly-comprehensive-tests:
    name: Weekly Comprehensive Tests
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0' || inputs.test_type == 'comprehensive'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd testing
          npm ci

      - name: Setup test databases
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:latest
          docker run -d --name postgres-test -e POSTGRES_PASSWORD=test -p 5432:5432 postgres:13
          sleep 30

      - name: Seed test data
        run: |
          cd testing
          node scripts/test-data-seeder.js seed

      - name: Run comprehensive test suite
        run: |
          cd testing
          npm run test:comprehensive
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run regression tests
        run: |
          cd testing
          npm run test:regression
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run compatibility tests
        run: |
          cd testing
          npm run test:compatibility
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Generate comprehensive report
        run: |
          cd testing
          npm run test:comprehensive:report
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-comprehensive-results
          path: testing/reports/
          retention-days: 30

      - name: Cleanup test data
        run: |
          cd testing
          node scripts/test-data-seeder.js cleanup
        if: always()

  # Monthly performance baseline
  monthly-performance-baseline:
    name: Monthly Performance Baseline
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *' || inputs.test_type == 'performance'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd testing
          npm ci

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Run cold start performance tests
        run: |
          cd testing
          npm run test:performance:cold-start
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run sustained load tests
        run: |
          cd testing
          npm run test:performance:sustained
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run scaling tests
        run: |
          cd testing
          npm run test:performance:scaling
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run memory optimization tests
        run: |
          cd testing
          npm run test:performance:memory
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Generate performance baseline
        run: |
          cd testing
          npm run test:performance:baseline
        if: always()

      - name: Compare with previous baselines
        run: |
          cd testing
          npm run test:performance:compare
        if: always()

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-performance-baseline
          path: testing/reports/performance/
          retention-days: 90

  # Security monitoring
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    if: inputs.test_type == 'security'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd testing
          npm ci

      - name: Run security penetration tests
        run: |
          cd testing
          npm run test:security:penetration
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Run vulnerability scans
        run: |
          cd testing
          npm run test:security:vulnerability
        env:
          TEST_TARGET_URL: ${{ env.PRODUCTION_URL }}

      - name: Check for dependency vulnerabilities
        run: |
          cd aiag_back
          npm audit --audit-level high --json > ../testing/reports/audit-back.json
          cd ../aiaghub
          npm audit --audit-level high --json > ../testing/reports/audit-hub.json

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: ${{ env.PRODUCTION_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Generate security report
        run: |
          cd testing
          npm run test:security:report
        if: always()

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-monitoring-results
          path: testing/reports/security/

  # Migration readiness assessment
  migration-readiness:
    name: Migration Readiness Assessment
    runs-on: ubuntu-latest
    if: inputs.test_type == 'migration-readiness'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd testing
          npm ci

      - name: Check system dependencies
        run: |
          cd testing
          npm run test:migration:dependencies

      - name: Validate backup procedures
        run: |
          cd testing
          npm run test:migration:backup-validation

      - name: Test rollback procedures
        run: |
          cd testing
          node scripts/rollback-procedures.js --dry-run

      - name: Check data consistency
        run: |
          cd testing
          npm run test:migration:data-consistency

      - name: Validate Vercel configuration
        run: |
          cd testing
          npm run test:migration:vercel-config

      - name: Generate readiness report
        run: |
          cd testing
          npm run test:migration:readiness-report
        if: always()

      - name: Upload readiness assessment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-readiness-assessment
          path: testing/reports/migration/

  # Monitoring dashboard updates
  monitoring-dashboard:
    name: Update Monitoring Dashboard
    runs-on: ubuntu-latest
    needs: [daily-health-checks, weekly-comprehensive-tests, monthly-performance-baseline]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4

      - name: Update monitoring dashboard
        run: |
          # This would update a monitoring dashboard with test results
          echo "Updating monitoring dashboard with latest test results..."
        env:
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}

      - name: Generate trend analysis
        run: |
          # This would analyze trends in test results over time
          echo "Generating trend analysis..."

      - name: Send weekly summary
        uses: 8398a7/action-slack@v3
        if: github.event.schedule == '0 2 * * 0'
        with:
          status: success
          text: |
            📊 Weekly Test Summary
            Health Checks: ${{ needs.daily-health-checks.result }}
            Comprehensive Tests: ${{ needs.weekly-comprehensive-tests.result }}
            Performance Baseline: ${{ needs.monthly-performance-baseline.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Alerting and notifications
  alerting:
    name: Process Alerts and Notifications
    runs-on: ubuntu-latest
    needs: [daily-health-checks, weekly-comprehensive-tests, monthly-performance-baseline, security-monitoring]
    if: always() && (failure() || needs.daily-health-checks.result == 'failure')
    
    steps:
      - name: Evaluate alert conditions
        run: |
          echo "Evaluating alert conditions..."
          echo "ALERT_LEVEL=high" >> $GITHUB_ENV
        if: needs.daily-health-checks.result == 'failure'

      - name: Send critical alerts
        uses: 8398a7/action-slack@v3
        if: env.ALERT_LEVEL == 'high'
        with:
          status: failure
          text: |
            🚨 CRITICAL ALERT: System health check failed!
            This requires immediate attention.
            Check the workflow logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}

      - name: Create incident ticket
        uses: actions/github-script@v6
        if: env.ALERT_LEVEL == 'high'
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Critical: System Health Check Failed',
              body: `
              ## Alert Details
              - **Severity**: Critical
              - **Time**: ${new Date().toISOString()}
              - **Affected Systems**: Production/Staging
              - **Workflow**: ${context.workflow}
              
              ## Next Steps
              1. Check system logs
              2. Verify service availability
              3. Investigate root cause
              4. Implement fix
              5. Update incident response
              `,
              labels: ['critical', 'incident', 'health-check'],
              assignees: ['devops-team']
            });

  # Cleanup old artifacts
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0'
    
    steps:
      - name: Cleanup old test artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < thirtyDaysAgo && artifact.name.includes('test-results')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`Deleted old artifact: ${artifact.name}`);
              }
            }