name: Deploy to Production (bare-metal VPS)

# ============================================================================
# AI Aggregator rolling deploy — build in CI → atomic `current` swap → pm2.
#
# WHY THIS WAS REWRITTEN (audit F1–F9 / 2026-06):
#   F1  `pm2 reload` errors on fork-mode procs ("Process not found"). Old
#       fallback ended in `exit 1`, so even a recoverable restart was marked
#       failed. FIX: self-heal chain reload→restart→startOrReload(ecosystem).
#   F2  pm2 was started on ABSOLUTE old-release paths, so symlink swap was a
#       no-op — restart re-exec'd stale code. FIX: the committed ecosystem
#       file pins every app's cwd/script to `/srv/aiag/<app>/current/...`, so
#       once pm2 is re-pinned (one-time, see ops/ecosystem.config.cjs header)
#       swap+restart ALWAYS runs new code.
#   F3  The committed ops/ecosystem.config.cjs is validated, packaged, and
#       installed at /srv/aiag/shared/ before the startOrReload recovery tier.
#   F5+F6  Build on the GitHub runner; ship .next/dist in the tarball. The box
#       only runs `bun install --production` + `next start`/`node dist`.
#   F7  Migrations are MANUAL + UNTRACKED on prod and the app DB role cannot
#       ALTER (see packages/database/CLAUDE.md). This pipeline DELIBERATELY
#       does NOT run migrations — see the "Migrations" note in the deploy job.
#   F9  Per-app health path+port;
#       rollback resolves "previous" from `readlink current` BEFORE swap,
#       not by mtime; the build IS a gate (no `|| true`).
#
# ARCHITECTURE (see /AGENTS.md):
#   Aggregator (RUB): web(:3000) + gateway(:4000) + worker(no port)
#   Each app has its OWN /srv/aiag/<app>/{releases,current} tree + its OWN pm2
#   entry. The `apps` input selects which to ship; passing web,gateway,worker
#   deploys the complete active service set.
#   The matrix below preserves one app per release tree.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: true
        default: 'master'
      apps:
        description: 'Apps (comma-sep): web,gateway,worker'
        required: true
        default: 'web,gateway,worker'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # plan — turn the comma-separated `apps` input into a JSON matrix of only the
  # apps actually requested:
  # each selected app becomes one isolated matrix leg (own build + own swap).
  # --------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: release
        run: |
          RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          APPS: ${{ inputs.apps }}
        run: |
          # Validate against the known app set and emit {"app":[...]} for the matrix.
          KNOWN="web gateway worker"
          ITEMS=""
          for APP in $(echo "$APPS" | tr ',' ' '); do
            APP="$(echo "$APP" | xargs)"   # trim
            [[ -z "$APP" ]] && continue
            case " $KNOWN " in
              *" $APP "*) ITEMS="$ITEMS \"$APP\"" ;;
              *) echo "::error::Unknown app '$APP' (allowed: $KNOWN)"; exit 1 ;;
            esac
          done
          [[ -z "$ITEMS" ]] && { echo "::error::No valid apps in input"; exit 1; }
          JSON="{\"app\":[$(echo $ITEMS | tr ' ' ',')]}"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Deploy matrix: $JSON"

  # --------------------------------------------------------------------------
  # build — one matrix leg PER APP. Builds shared libs first, then the app,
  # then packages a tarball that INCLUDES the build output (.next / dist).
  # This is the OOM-killer: the 2GB VPS never runs `next build` / `tsc`.
  # --------------------------------------------------------------------------
  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # one app failing to build must not abort sibling apps
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps (workspace-wide)
        # Use the same pinned Bun runtime and lockfile as local verification.
        run: bun install --frozen-lockfile

      # Shared workspace libs must exist (dist/) before any app build so that
      # @aiag/shared, @aiag/database, gateway etc. resolve. Cheap + idempotent.
      - name: Build shared libraries
        run: |
          source ops/scripts/release-contract.sh
          aiag_build_shared_packages "$GITHUB_WORKSPACE"

      # Per-app real build. NOTE: build IS a gate now (no `|| true`) — a broken
      # build must NOT ship. Each `case` matches the matrix leg exactly.
      - name: Build ${{ matrix.app }}
        env:
          APP_VERSION: ${{ needs.plan.outputs.release }}
          GIT_SHA: ${{ needs.plan.outputs.sha }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          # Keep headroom for the Next.js web build.
          NODE_OPTIONS: --max-old-space-size=6144
          # apps/web login/register buttons gate on this NEXT_PUBLIC_* flag.
          # NEXT_PUBLIC_* vars are inlined into the JS bundle at `next build`
          # time, not read at runtime — so setting it only in
          # /srv/aiag/shared/.env has no effect; it must be present HERE.
          # Sourced from a repo Actions variable (Settings → Secrets and
          # variables → Actions → Variables → NEXT_PUBLIC_ENABLE_YANDEX) so
          # the founder can flip it to "1" once YANDEX_CLIENT_ID/SECRET are
          # set, without touching this workflow again. Unset/anything-but-"1"
          # keeps the Yandex button hidden (fail-closed default).
          NEXT_PUBLIC_ENABLE_YANDEX: ${{ vars.NEXT_PUBLIC_ENABLE_YANDEX }}
          # Same pattern for the VK button (Settings → Secrets and variables →
          # Actions → Variables → NEXT_PUBLIC_ENABLE_VK). Fail-closed default:
          # unset/anything-but-"1" keeps the VK button hidden. Flip once
          # VK_CLIENT_ID/VK_CLIENT_SECRET are set in /srv/aiag/shared/.env.
          NEXT_PUBLIC_ENABLE_VK: ${{ vars.NEXT_PUBLIC_ENABLE_VK }}
        run: |
          case "${{ matrix.app }}" in
            web)          bun run --cwd apps/web build ;;            # next build → apps/web/.next
            gateway)      bun run --cwd packages/api-gateway build ;; # tsup       → packages/api-gateway/dist
            worker)       bun run --cwd apps/worker build ;;          # tsc        → apps/worker/dist
          esac

      - name: Verify release contract (${{ matrix.app }})
        run: |
          source ops/scripts/release-contract.sh
          node ops/scripts/verify-ecosystem-config.cjs ops/ecosystem.config.cjs
          aiag_verify_release_artifacts "$GITHUB_WORKSPACE" "${{ matrix.app }}"

      # Tests are advisory for now (kept non-gating until the suite stabilizes).
      # The BUILD above is the real gate.
      - name: Run tests (advisory)
        run: bun run test:unit || echo "::warning::tests failed (advisory, not gating)"

      # Package the WHOLE repo INCLUDING build outputs. We only drop caches and
      # VCS/scratch dirs — .next/ and dist/ MUST be kept so the box never builds.
      # node_modules is excluded; the box runs `bun install --production` per release.
      - name: Package tarball (${{ matrix.app }})
        run: |
          mkdir -p dist-pkg
          tar --exclude='./node_modules' \
              --exclude='*/node_modules' \
              --exclude='./.git' \
              --exclude='./dist-pkg' \
              --exclude='**/.next/cache' \
              --exclude='*.log' \
              -czf "dist-pkg/release.tar.gz" .

      # Ship the tarball STRAIGHT to the VPS (no GitHub artifact). The Actions
      # artifact-storage quota repeatedly filled and hard-blocked deploys
      # (2026-06-12, "Artifact storage quota has been hit") with a 6-12h recalc
      # lag. Bypassing artifacts entirely removes that dependency and makes the
      # deploy work immediately + automatically. The deploy job below extracts
      # the tarball already sitting in /srv/aiag/deploy/tmp on the box.
      - name: Ship tarball to VPS (${{ matrix.app }})
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ needs.plan.outputs.release }}
          APP: ${{ matrix.app }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "mkdir -p /srv/aiag/deploy/tmp/$RELEASE/$APP"
          scp dist-pkg/release.tar.gz "$USER@$HOST:/srv/aiag/deploy/tmp/$RELEASE/$APP/"

  # --------------------------------------------------------------------------
  # deploy — one matrix leg PER APP. Each leg: upload tarball → extract into
  # the app's OWN /srv/aiag/<app>/releases/<release> → bun install --production
  # → atomic `current` symlink swap → pm2 self-heal chain → per-app health
  # check → rollback on failure. The ecosystem references `current`, so a
  # symlink swap + restart deterministically picks up new code (fixes F2).
  # --------------------------------------------------------------------------
  deploy:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # an app's deploy failing must not abort siblings
      max-parallel: 1    # serialize SSH sessions to the single VPS
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment:
      name: production
      url: https://ai-aggregator.ru
    steps:
      # No download-artifact: the build job already scp'd the tarball straight
      # to /srv/aiag/deploy/tmp/$RELEASE/$APP on the box (artifact bypass).
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Atomic swap + pm2 self-heal + health (${{ matrix.app }})
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ needs.plan.outputs.release }}
          APP: ${{ matrix.app }}
        run: |
          # Pass APP/RELEASE as remote env so we avoid heredoc escaping hell.
          ssh "$USER@$HOST" "APP='$APP' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          ECOSYSTEM="/srv/aiag/shared/ecosystem.config.cjs"
          # pm2 runs under root but the deploy user is non-root → plain `pm2
          # restart` hit "Process or Namespace not found" and the deploy needed
          # a MANUAL restart every single time. Try the local pm2, then sudo to
          # root's pm2 (passwordless sudo on the box) so deploys self-complete.
          pm2do() { pm2 "$@" 2>/dev/null || sudo -n pm2 "$@"; }
          TARGET="/srv/aiag/$APP/releases/$RELEASE"
          CURRENT="/srv/aiag/$APP/current"
          # Capture the PREVIOUS release BEFORE we swap, for a precise rollback
          # (F9 — never resolve "previous" by mtime).
          PREV_LINK="$(readlink "$CURRENT" 2>/dev/null || echo '')"

          echo "[$APP] extract → $TARGET"
          mkdir -p "$TARGET"
          tar -xzf "/srv/aiag/deploy/tmp/$RELEASE/$APP/release.tar.gz" -C "$TARGET"

          # Per-release runtime deps. Build OUTPUTS (.next / dist) are already in
          # the tarball — this only supplies node_modules to run them.
          cd "$TARGET"
          bun install --production --frozen-lockfile

          # Install the exact reviewed process map included in this release.
          # Do not assume the external shared copy already exists or is current.
          node ops/scripts/verify-ecosystem-config.cjs ops/ecosystem.config.cjs
          install -d "$(dirname "$ECOSYSTEM")"
          install -m 0644 ops/ecosystem.config.cjs "$ECOSYSTEM"

          # ---- Atomic swap: the ONLY thing that flips a release live. -------
          ln -sfn "$TARGET" "$CURRENT"

          # ---- Prune old releases NOW (before pm2) so a pm2/health hiccup can
          # never leave the disk filling up — releases piled to 36 (~7G) when the
          # post-pm2 cleanup got skipped by a failing pm2 step (2026-06-12).
          ( cd "/srv/aiag/$APP/releases" && ls -1t | tail -n +6 | xargs -r rm -rf ) || true
          rm -rf "/srv/aiag/deploy/tmp/$RELEASE/$APP" || true

          # ---- Restart (root's pm2 via pm2do). self-heal chain:
          #   reload  — graceful, works if proc exists (cluster or fork)
          #   restart — fork-mode safe re-exec
          #   startOrReload <ecosystem> --only $APP — recreate if proc gone
          pm2do reload "$APP" --update-env \
            || pm2do restart "$APP" --update-env \
            || pm2do startOrReload "$ECOSYSTEM" --only "$APP" --update-env
          pm2do save || true

          # ---- Per-app health check (F9). --------------------------------------
          # web → :3000/health, gateway → :4000/health.
          # worker has no HTTP port, so verify its pm2 status instead.
          HEALTH_URL=""
          case "$APP" in
            web)          HEALTH_URL="http://127.0.0.1:3000/health" ;;
            gateway)      HEALTH_URL="http://127.0.0.1:4000/health" ;;
            worker)       HEALTH_URL="" ;;                          # no HTTP — pm2-status check below
          esac

          sleep 4
          HEALTHY=1
          if [[ -n "$HEALTH_URL" ]]; then
            curl -fsS --max-time 6 "$HEALTH_URL" >/dev/null || HEALTHY=0
          else
            # Non-HTTP worker: must be 'online' and not flapping. MUST force
            # root's pm2 — `pm2 jlist` as the non-root deploy user SUCCEEDS with
            # an EMPTY list (exit 0), so the proc (in root's daemon) looks absent
            # → false-fail + rollback. (Fixed in agent-market split; ported here.)
            STATUS="$( { sudo -n pm2 jlist 2>/dev/null || pm2 jlist; } | jq -r ".[] | select(.name==\"$APP\") | .pm2_env.status" | head -n1)"
            [[ "$STATUS" == "online" ]] || HEALTHY=0
          fi

          if [[ "$HEALTHY" -ne 1 ]]; then
            echo "[$APP] HEALTH FAILED — rolling back"
            if [[ -n "$PREV_LINK" ]]; then
              ln -sfn "$PREV_LINK" "$CURRENT"
              pm2do reload "$APP" --update-env \
                || pm2do restart "$APP" --update-env \
                || pm2do startOrReload "$ECOSYSTEM" --only "$APP" --update-env
              pm2do save || true
              echo "[$APP] rolled back to $PREV_LINK"
            else
              echo "[$APP] no previous release to roll back to"
            fi
            exit 1
          fi
          echo "[$APP] healthy"
          REMOTE

      # ----------------------------------------------------------------------
      # MIGRATIONS — DELIBERATELY NOT RUN BY THIS PIPELINE (audit F7).
      # Prod migrations are MANUAL and UNTRACKED, and the app DB role `aiag`
      # CANNOT run ALTER (see packages/database/CLAUDE.md). Schema changes go
      # through `sudo -u postgres psql aiag` by hand, in order, BEFORE shipping
      # code that depends on them. The manual recipe lives in skill `aiag-deploy`.
      # Do NOT add an automatic `db:migrate` step here — it would either fail
      # (no ALTER grant) or silently diverge from the untracked prod state.
      # ----------------------------------------------------------------------

  notify:
    needs: [plan, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          STATUS: ${{ needs.deploy.result }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          if [[ -n "$BOT_TOKEN" && -n "$CHAT_ID" ]]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=Deploy $STATUS: release=$RELEASE apps=${{ inputs.apps }}"
          fi
