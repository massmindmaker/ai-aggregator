# nginx vhost snippet for the TMA (Telegram Mini App) — /tg location block.
#
# PURPOSE:
#   This file is the canonical reference snippet to apply on the VPS at
#   /etc/nginx/sites-available/ai-aggregator.ru (or the relevant include file).
#   It documents every directive needed for the TMA upstream in one place.
#
# HUMAN ACTION REQUIRED:
#   1. Merge the /tg location block below into the live vhost (or replace the
#      existing /tg location if one already exists).
#   2. Run:  nginx -t && systemctl reload nginx
#
# CVE-2025-29927 DEFENSE IN DEPTH:
#   The directive `proxy_set_header x-middleware-subrequest "";` blanks any
#   inbound x-middleware-subrequest header BEFORE it reaches the Next.js process.
#   This closes the CVE-2025-29927 middleware-skip bypass at the nginx layer,
#   complementing the Next.js 14.2.33 patch (Task 1).
#   See: https://nextjs.org/blog/cve-2025-29927
#
# REFERENCE:
#   - TMA pm2 name  : tma
#   - Next.js port  : 3100  (next start -p 3100)
#   - basePath      : /tg   (configured in next.config.js)
#   - health check  : /tg/health

upstream tma_upstream {
    server 127.0.0.1:3100;
    keepalive 16;
}

# /tg location — proxy to the Next.js TMA process
location /tg {
    proxy_pass         http://tma_upstream;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # CVE-2025-29927: strip the bypass header at the nginx edge (belt-and-suspenders
    # alongside the Next.js 14.2.33 bump).  Setting to "" removes any client-supplied
    # value; the header is never forwarded to the Next.js process.
    proxy_set_header   x-middleware-subrequest "";

    # Also strip any client-supplied x-tma-user-id — the middleware re-sets it from
    # the verified JWT sub claim. This prevents header injection even if the Next
    # middleware is bypassed for any reason.
    proxy_set_header   x-tma-user-id "";

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_buffer_size   8k;
    proxy_buffers       8 8k;
}
