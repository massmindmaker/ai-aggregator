# Nginx vhost for the Telegram Mini App (Phase 15).
#
# Subdomain: app.ai-aggregator.ru
# Routes:
#   /tg/*                                  → 127.0.0.1:3100 (apps/tg-miniapp, Next standalone)
#   /.well-known/tonconnect-manifest.json  → static file from the released apps/tg-miniapp/public
#
# Cert via:  certbot --nginx -d app.ai-aggregator.ru
# Validate: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.ai-aggregator.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ai-aggregator.ru;

    ssl_certificate     /etc/letsencrypt/live/app.ai-aggregator.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ai-aggregator.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Standard hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Telegram wraps the WebApp in its own client; allow framing by t.me.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" always;

    client_max_body_size 8m;

    # TON Connect manifest must be reachable WITHOUT the /tg prefix so wallets
    # can fetch it directly. Served as a static file from the released tree.
    location = /.well-known/tonconnect-manifest.json {
        alias /srv/aiag/tma/current/apps/tg-miniapp/public/tonconnect-manifest.json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Root → redirect into /tg/ so people don't see a 404 if they land on the apex.
    location = / {
        return 302 /tg/;
    }

    # Mini App proxied to Next standalone on :3100.
    location /tg {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
